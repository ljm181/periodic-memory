  <style>
    :root{
      --bg1:#071226;
      --bg2:#0b1630;
      --card:#0e1d3a;
      --card2:#0b1730;
      --text:#eaf2ff;
      --muted:#b7c7e6;
      --line:rgba(148,163,184,.18);

      --metal:#ffd97b;
      --nonmetal:#8ae6b1;
      --metalloid:#7fd0ff;

      --btn:#132a55;
      --btn2:#183463;
      --btnText:#eaf2ff;
      --shadow:0 14px 40px rgba(0,0,0,.35);
      --shadow2:0 10px 24px rgba(0,0,0,.26);
      --radius:18px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% 15%, rgba(70,120,255,.22), transparent 55%),
        radial-gradient(900px 650px at 85% 25%, rgba(0,220,160,.18), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height: 100dvh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    .app{
      width:min(980px, 100%);
      margin:0 auto;
      padding:14px 14px 18px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    header{
      background: rgba(255,255,255,.05);
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding:12px 12px;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      backdrop-filter: blur(10px);
    }

    .titleWrap{
      display:flex;
      align-items:baseline;
      gap:10px;
      flex-wrap:wrap;
    }
    h1{
      margin:0;
      font-size: clamp(18px, 2.2vw, 22px);
      letter-spacing:.5px;
    }
    .sub{
      color:var(--muted);
      font-size: 13px;
    }
    .progress{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background: rgba(0,0,0,.14);
      font-size:13px;
      color:var(--text);
      white-space:nowrap;
    }

    .filters{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .chip{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background: rgba(0,0,0,.14);
      user-select:none;
      cursor:pointer;
      transition: transform .08s ease;
      font-size:13px;
      white-space:nowrap;
    }
    .chip:active{ transform: scale(.98); }

    .dot{
      width:10px;height:10px;border-radius:50%;
      box-shadow: 0 0 0 3px rgba(255,255,255,.06);
    }
    .dot.metal{ background:var(--metal); }
    .dot.nonmetal{ background:var(--nonmetal); }
    .dot.metalloid{ background:var(--metalloid); }

    .chip input{ accent-color:#7fb0ff; }

    main{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .cardWrap{
      display:flex;
      justify-content:center;
    }

    .card{
      width: min(520px, 92vw);
      height: min(70vh, 640px);
      min-height: 360px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--line);
      border-radius: 26px;
      box-shadow: var(--shadow);
      position:relative;
      perspective: 1200px;
      overflow:hidden;
    }

    .cardHint{
      position:absolute;
      top:10px; right:10px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background: rgba(0,0,0,.16);
      color: var(--muted);
      font-size:12px;
      z-index:3;
      pointer-events:none;
    }

    .inner{
      width:100%; height:100%;
      position:absolute; inset:0;
      transform-style: preserve-3d;
      transition: transform .65s cubic-bezier(.2,.8,.2,1);
    }
    .card.flipped .inner{ transform: rotateY(180deg); }

    .face{
      position:absolute; inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      backface-visibility:hidden;
      padding:22px 18px;
      gap:14px;
    }

    .front{
      background: radial-gradient(900px 520px at 30% 10%, rgba(110,170,255,.18), transparent 55%),
                  linear-gradient(180deg, rgba(0,0,0,.12), rgba(0,0,0,.02));
    }
    .back{
      transform: rotateY(180deg);
      background: radial-gradient(900px 520px at 70% 15%, rgba(0,220,160,.16), transparent 55%),
                  linear-gradient(180deg, rgba(0,0,0,.12), rgba(0,0,0,.02));
    }

    .badge{
      position:absolute;
      left:14px; top:14px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background: rgba(0,0,0,.16);
      font-weight:700;
      font-size:13px;
      color: var(--text);
      display:flex;
      gap:8px;
      align-items:center;
    }

    .badge .miniDot{
      width:10px;height:10px;border-radius:50%;
    }

    .symbol{
      font-weight:900;
      letter-spacing:1px;
      font-size: clamp(72px, 12vw, 140px);
      line-height:1;
      text-shadow: 0 8px 22px rgba(0,0,0,.35);
    }

    .atomic{
      font-size: clamp(14px, 3.2vw, 22px);
      color: var(--muted);
      margin-top:-4px;
    }

    .name{
      font-size: clamp(56px, 11vw, 128px);
      font-weight:900;
      line-height:1.02;
      text-shadow: 0 8px 22px rgba(0,0,0,.35);
      text-align:center;
      word-break: keep-all;
      padding: 0 10px;
    }

    .mass{
      font-size: clamp(16px, 3.6vw, 24px);
      color: var(--muted);
      margin-top:-6px;
    }

    .controls{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      appearance:none;
      border:1px solid var(--line);
      background: linear-gradient(180deg, var(--btn2), var(--btn));
      color: var(--btnText);
      padding: 12px 14px;
      border-radius: 14px;
      box-shadow: 0 10px 18px rgba(0,0,0,.22);
      font-weight:800;
      font-size: 14px;
      cursor:pointer;
      transition: transform .08s ease, filter .15s ease;
      min-width: 110px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      user-select:none;
      text-decoration:none;
    }
    .btn:active{ transform: scale(.98); }
    .btn:hover{ filter: brightness(1.06); }

    .btn.secondary{
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
    }

    .btn.icon{
      min-width: 0;
      padding: 12px 14px;
    }

    .status{
      text-align:center;
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
    }

    /* Modal */
    .modal{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.60);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 999;
    }
    .modal.show{ display:flex; }

    .modalPanel{
      width: min(1100px, 96vw);
      height: min(78vh, 720px);
      border-radius: 18px;
      background: rgba(8,18,40,.92);
      border:1px solid var(--line);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .modalTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 10px;
      border-bottom:1px solid var(--line);
      background: rgba(255,255,255,.04);
    }

    .modalTitle{
      font-weight:800;
      font-size:14px;
      color: var(--text);
    }

    iframe{
      border:0;
      width:100%;
      height:100%;
      background:white;
    }

    /* Small screens */
    @media (max-width: 420px){
      .btn{ min-width: 96px; padding: 12px 12px; }
      .card{ min-height: 340px; }
    }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce){
      .inner{ transition:none; }
      .btn{ transition:none; }
      .chip{ transition:none; }
    }

  /* 【大螢幕優化】讓字卡內距縮小，釋放空間給字 */
@media (min-width: 768px){
  .face{
    padding:16px 14px;
    gap:10px;
  }
}

  </style>

    </main>
  </div>

  {id:108, s:"Hs", n:"𨭆", w:"(277)", c:"金屬", t:"metal"},
  {id:109, s:"Mt", n:"䥑", w:"(278)", c:"金屬", t:"metal"},
  {id:110, s:"Ds", n:"鐽", w:"(281)", c:"金屬", t:"metal"},
  {id:111, s:"Rg", n:"錀", w:"(282)", c:"金屬", t:"metal"},
  {id:112, s:"Cn", n:"鎶", w:"(285)", c:"金屬", t:"metal"},
  {id:113, s:"Nh", n:"鉨", w:"(286)", c:"金屬", t:"metal"},
  {id:114, s:"Fl", n:"鈇", w:"(289)", c:"金屬", t:"metal"},
  {id:115, s:"Mc", n:"鏌", w:"(290)", c:"金屬", t:"metal"},
  {id:116, s:"Lv", n:"鉝", w:"(293)", c:"金屬", t:"metal"},
  {id:117, s:"Ts", n:"鿬", w:"(294)", c:"非金屬", t:"nonmetal"},
  {id:118, s:"Og", n:"鿫", w:"(294)", c:"非金屬", t:"nonmetal"}
    ];

    // ---- State ----
    let pool = [];
    let idx = 0;

    // ---- DOM ----
    const card = document.getElementById("card");
    const progress = document.getElementById("progress");
    const status = document.getElementById("status");

    const symFront = document.getElementById("symFront");
    const idFront = document.getElementById("idFront");
    const idFront2 = document.getElementById("idFront2");
    const catFront = document.getElementById("catFront");

    const nameBack = document.getElementById("nameBack");
    const massBack = document.getElementById("massBack");
    const idBack = document.getElementById("idBack");
    const catBack = document.getElementById("catBack");

    const miniDotFront = document.getElementById("miniDotFront");
    const miniDotBack = document.getElementById("miniDotBack");

    const chkMetal = document.getElementById("chkMetal");
    const chkNonmetal = document.getElementById("chkNonmetal");
    const chkMetalloid = document.getElementById("chkMetalloid");

    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const btnRand = document.getElementById("btnRand");


    function catColor(type){
      if(type === "metal") return getComputedStyle(document.documentElement).getPropertyValue("--metal").trim();
      if(type === "nonmetal") return getComputedStyle(document.documentElement).getPropertyValue("--nonmetal").trim();
      return getComputedStyle(document.documentElement).getPropertyValue("--metalloid").trim();
    }

    function buildPool(){
      const types = new Set();
      if(chkMetal.checked) types.add("metal");
      if(chkNonmetal.checked) types.add("nonmetal");
      if(chkMetalloid.checked) types.add("metalloid");

      // 防呆：至少勾一個
      if(types.size === 0){
        chkMetal.checked = true;
        chkNonmetal.checked = true;
        chkMetalloid.checked = true;
        types.add("metal"); types.add("nonmetal"); types.add("metalloid");
        status.textContent = "已自動恢復：至少需選 1 類（已恢復全選）。";
      }else{
        status.textContent = `目前練習類別：${[
          chkMetal.checked ? "金屬" : null,
          chkNonmetal.checked ? "非金屬" : null,
          chkMetalloid.checked ? "類金屬" : null
        ].filter(Boolean).join("、")}（共 ${Array.from(types).length} 類）`;
      }

      pool = allElements.filter(e => types.has(e.t));
      idx = 0;
      render();
    }

    function render(){
      if(pool.length === 0){
        progress.textContent = "0 / 0";
        symFront.textContent = "—";
        idFront.textContent = "—";
        idFront2.textContent = "—";
        catFront.textContent = "—";
        nameBack.textContent = "—";
        massBack.textContent = "—";
        idBack.textContent = "—";
        catBack.textContent = "—";
        return;
      }

      const e = pool[idx];
      symFront.textContent = e.s;
      idFront.textContent = e.id;
      idFront2.textContent = e.id;
      catFront.textContent = e.c;

      nameBack.textContent = e.n;
      massBack.textContent = e.w;
      idBack.textContent = e.id;
      catBack.textContent = e.c;

      const color = catColor(e.t);
      miniDotFront.style.background = color;
      miniDotBack.style.background = color;

      progress.textContent = `${idx + 1} / ${pool.length}`;
    }

    function prev(){
      if(pool.length === 0) return;
      idx = (idx - 1 + pool.length) % pool.length;
      card.classList.remove("flipped");
      render();
    }

    function next(){
      if(pool.length === 0) return;
      idx = (idx + 1) % pool.length;
      card.classList.remove("flipped");
      render();
    }

    function rand(){
      if(pool.length === 0) return;
      let newIdx = idx;
      if(pool.length > 1){
        while(newIdx === idx) newIdx = Math.floor(Math.random() * pool.length);
      }
      idx = newIdx;
      card.classList.remove("flipped");
      render();
    }

    function flip(){
      card.classList.toggle("flipped");
    }

    // ---- Events ----
    chkMetal.addEventListener("change", buildPool);
    chkNonmetal.addEventListener("change", buildPool);
    chkMetalloid.addEventListener("change", buildPool);

    btnPrev.addEventListener("click", prev);
    btnNext.addEventListener("click", next);
    btnRand.addEventListener("click", rand);

    card.addEventListener("click", flip);
    card.addEventListener("keydown", (ev)=>{
      if(ev.key === "Enter" || ev.key === " "){
        ev.preventDefault();
        flip();
      }
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", (ev)=>{
      // 避免在輸入框時觸發（目前頁面沒有 input text，但先防呆）
      const tag = (ev.target && ev.target.tagName) ? ev.target.tagName.toLowerCase() : "";
      if(tag === "input" || tag === "textarea") return;

      if(ev.key === "ArrowLeft") prev();
      if(ev.key === "ArrowRight") next();
      if(ev.key.toLowerCase() === "r") rand();
      if(ev.key === " "){ ev.preventDefault(); flip(); }
    });


    // Init
    buildPool();
    status.textContent = "已載入 118 全元素。預設：三類全選。";
  </script>
</body>
</html>
