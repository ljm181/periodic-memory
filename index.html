const $=id=>document.getElementById(id); const card=$('card'); let limit=20, pool=[], idx=0, weak=new Set(), judged=new Map(), weakMode=false;
function color(t){return t==='metal'?'var(--metal)':t==='nonmetal'?'var(--nonmetal)':'var(--metalloid)'}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rebuild(keep=false){let base=weakMode?allElements.filter(e=>weak.has(e.id)):allElements.filter(e=>e.id<=limit);pool=[...base];if($('order').value==='random')shuffle(pool);if(!keep)idx=0;card.classList.remove('flipped');render();updateStats()}
function render(){if(!pool.length){$('question').textContent='完成';$('questionSub').textContent='沒有待加強元素';$('answer').textContent='🎉';$('answerSub').textContent='可以回到全部範圍再複習';$('progress').textContent='0 / 0';return}let e=pool[idx];let fm=$('frontMode').value; $('question').textContent=fm==='symbol'?e.s:e.n;$('question').className=fm==='symbol'?'symbol':'name';$('questionSub').textContent=`原子序：${e.id}`;$('answer').textContent=fm==='symbol'?e.n:e.s;$('answer').className=fm==='symbol'?'name':'symbol';$('answerSub').textContent=fm==='symbol'?`元素符號：${e.s}　｜　原子量：${e.w}`:`元素名稱：${e.n}　｜　原子量：${e.w}`;['F','B'].forEach(x=>{$('dot'+x).style.background=color(e.t);$('cat'+x).textContent=e.c;$('id'+x).textContent=e.id});$('progress').textContent=`${idx+1} / ${pool.length}`;$('status').textContent=weak.has(e.id)?'⭐ 這題已列入待加強':''}
function flip(){card.classList.toggle('flipped')}
function move(d){if(!pool.length)return;idx=(idx+d+pool.length)%pool.length;card.classList.remove('flipped');render()}
function judge(ok){if(!pool.length)return;let e=pool[idx];judged.set(e.id,ok);if(ok)weak.delete(e.id);else weak.add(e.id);updateStats(); if(weakMode&&ok){pool.splice(idx,1);if(idx>=pool.length)idx=0;card.classList.remove('flipped');render()}else move(1)}
function updateStats(){let vals=[...judged.values()];$('seen').textContent=vals.length;$('known').textContent=vals.filter(Boolean).length;$('weakCount').textContent=weak.size;$('weakList').textContent=weak.size?[...weak].sort((a,b)=>a-b).map(id=>{let e=allElements[id-1];return `${e.s} ${e.n}`}).join('、'):'還沒有標記不熟的元素。';$('weakOnly').disabled=weak.size===0;$('weakOnly').textContent=weakMode?'返回目前範圍':'只複習待加強'}
document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-range]').forEach(x=>x.classList.remove('active'));b.classList.add('active');limit=+b.dataset.range;weakMode=false;judged.clear();weak.clear();rebuild()});$('order').onchange=()=>rebuild();$('frontMode').onchange=()=>{card.classList.remove('flipped');render()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('flip').onclick=flip;card.onclick=flip;$('again').onclick=()=>judge(false);$('know').onclick=()=>judge(true);$('weakOnly').onclick=()=>{weakMode=!weakMode;rebuild();};$('reset').onclick=()=>{judged.clear();weak.clear();weakMode=false;rebuild()};$('ptable').onclick=()=>window.open('https://ptable.com/?lang=zh-hant','_blank','noopener');
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key===' '){e.preventDefault();flip()}else if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);else if(e.key==='1')judge(false);else if(e.key==='2')judge(true)});
let sx=0,sy=0,st=0;card.addEventListener('touchstart',e=>{let t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});card.addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Date.now()-st<900&&Math.abs(dx)>48&&Math.abs(dy)<65){card.classList.add(dx<0?'swipe-left':'swipe-right');setTimeout(()=>card.classList.remove('swipe-left','swipe-right'),170);move(dx<0?1:-1)}},{passive:true});
const themeBtn=$('themeBtn');
function applyTheme(mode){document.body.classList.toggle('dark',mode==='dark');themeBtn.textContent=mode==='dark'?'☀️':'🌙';themeBtn.title=mode==='dark'?'切換淺色模式':'切換深色模式';localStorage.setItem('periodic-theme',mode)}
let savedTheme=localStorage.getItem('periodic-theme')||'light';applyTheme(savedTheme);themeBtn.onclick=()=>applyTheme(document.body.classList.contains('dark')?'light':'dark');
